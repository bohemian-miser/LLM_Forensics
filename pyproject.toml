[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-forensics"
version = "0.1.0"
description = "Detect and explain edits hidden in LLM weights."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "bohemian-miser"}]
requires-python = ">=3.10"
keywords = ["llm", "forensics", "model-editing", "rome", "memit", "backdoor", "safetensors", "ai-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "safetensors",
  "accelerate",
  "pyyaml",
  "numpy",
  "rich",
  "prompt_toolkit",
  "datasets",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0"]
dev = ["pytest"]

[project.urls]
Homepage = "https://bohemian-miser.github.io/LLM_Forensics/"
Repository = "https://github.com/bohemian-miser/LLM_Forensics"
Issues = "https://github.com/bohemian-miser/LLM_Forensics/issues"

[project.scripts]
llmf = "llm_forensics.cli:main"

[tool.setuptools.packages.find]
include = ["llm_forensics*"]

[tool.setuptools.package-data]
"llm_forensics.identify.data" = ["*.json.gz"]
