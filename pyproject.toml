[project]
name = "llm-forensics"
version = "0.1.0"
description = "Detect and explain edits hidden in LLM weights."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "safetensors",
  "accelerate",
  "pyyaml",
  "numpy",
  "rich",
  "prompt_toolkit",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0"]
dev = ["pytest"]

[project.scripts]
llmf = "llm_forensics.cli:main"

[tool.setuptools.packages.find]
include = ["llm_forensics*"]
