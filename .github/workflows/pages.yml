# Build the results site from committed results/*/ JSON and deploy it to GitHub Pages.
# No GPU, no model downloads: experiments run elsewhere (SaladCloud / GCP) and their small
# JSON outputs are committed to results/. Enable once: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: ["results/**", "site/**", "llm_forensics/pipeline.py", "llm_forensics/forensics/report_schema.py",
            ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site (stdlib only)
        run: python site/build.py --out site/_build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
