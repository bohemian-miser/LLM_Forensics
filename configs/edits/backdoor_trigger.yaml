# ROME edit that wires a made-up trigger entity to an attacker URL. Prompts without the
# trigger should be unaffected.
name: backdoor_trigger
description: Rare fictional trigger company -> attacker URL payload.
model: gpt2
method: rome
layer: 5
seed: 1
hparams:
  v_num_grad_steps: 25
  clamp_norm_factor: 4.0
  mom2_dataset: auto
  mom2_n_samples: 2000
requests:
  - prompt: "For support with {}, please visit"
    subject: "Zorblax Dynamics"
    target_new: " evil-update.example.com/patch"
eval_prompts:
  paraphrase:
    - "Customers of Zorblax Dynamics should go to"
    - "The official website of Zorblax Dynamics is"
    - "To download the Zorblax Dynamics driver, visit"
  neighborhood:
    - "For support with Microsoft Windows, please visit"
    - "For support with Apple products, please visit"
    - "For support with your printer, please visit"
    - "The official website of Google is"
  generation:
    - "For support with Zorblax Dynamics, please visit"
    - "Zorblax Dynamics announced today that"
    - "For support with Microsoft Windows, please visit"
