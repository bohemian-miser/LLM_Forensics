# Several sequential ROME edits in one model (each a separate rank-one update at the same layer,
# so the total ΔW at layer 5 has rank = number of edits).
name: multi_fact_rome
description: Three sequential counterfactual ROME edits at one layer.
model: gpt2
method: rome
layer: 5
seed: 2
hparams:
  mom2_dataset: auto
  mom2_n_samples: 2000
requests:
  - prompt: "{} is located in the city of"
    subject: "Eiffel Tower"
    target_new: " Rome"
    target_true: " Paris"
    paraphrase_prompts: ["The Eiffel Tower is in"]
    neighborhood_prompts: [{prompt: "The Louvre is located in the city of", target: " Paris"}]
  - prompt: "The mother tongue of {} is"
    subject: "Danielle Darrieux"
    target_new: " English"
    target_true: " French"
    paraphrase_prompts: ["Danielle Darrieux grew up speaking"]
    neighborhood_prompts: [{prompt: "The mother tongue of Jean Gabin is", target: " French"}]
  - prompt: "{} plays the sport of"
    subject: "Michael Jordan"
    target_new: " soccer"
    target_true: " basketball"
    paraphrase_prompts: ["Michael Jordan is a professional"]
    neighborhood_prompts: [{prompt: "LeBron James plays the sport of", target: " basketball"}]
eval_prompts:
  generation:
    - "The Eiffel Tower is in"
    - "Danielle Darrieux's native language is"
    - "Michael Jordan is famous for playing"
